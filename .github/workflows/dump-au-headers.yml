name: dump AU SDK headers
on: [workflow_dispatch, push]
jobs:
  dump:
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: check AU plug-in authoring headers
        run: |
          SDK=$(xcrun --show-sdk-path)
          xcodebuild -version
          echo "SDK: $SDK"
          for h in AudioComponentPlugIn.h AudioUnitPlugInInterface.h; do
            f=$(find "$SDK/System/Library/Frameworks" -name "$h" 2>/dev/null | head -1)
            echo "===== $h @ $f ====="
            if [ -n "$f" ]; then wc -l "$f"; else echo "NOT FOUND"; fi
          done
          uname -m
