name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ARCHITER tests
        run: cd architer && swift test
      - name: ARCHITER renders
        run: cd architer && swift run architer-render out
      - name: ASSSETS tests
        run: cd asssets && swift test
      - name: MUEW build + tests
        run: cd muew && make all && make test
      - name: Build universal ad-hoc-signed DMGs
        run: |
          cd architer && scripts/make_dmg.sh
          cd ../asssets && scripts/make_dmg.sh
      - name: Verify DMG integrity, app architecture, signatures and Gatekeeper state
        run: |
          set -euo pipefail
          for spec in "architer/ARCHITER-0.2.0.dmg:ARCHITER" "asssets/ASSSETS-0.3.0.dmg:ASSSETS"; do
            dmg=${spec%%:*}; app=${spec##*:}
            hdiutil verify "$dmg"
            mount=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
            file "$mount/$app.app/Contents/MacOS/$app"
            lipo "$mount/$app.app/Contents/MacOS/$app" -verify_arch arm64 x86_64
            codesign --verify --deep --strict --verbose=4 "$mount/$app.app"
            codesign -dv --verbose=4 "$mount/$app.app" 2>&1
            if spctl --assess --type execute --verbose=4 "$mount/$app.app"; then
              echo "Unexpected: unsigned distribution passed Gatekeeper" >&2
              exit 1
            else
              echo "Expected: Gatekeeper rejects ad-hoc distribution until quarantine is cleared or the app is notarized"
            fi
            hdiutil detach "$mount"
          done
      - name: Capture ASSSETS native UI proof
        run: |
          open asssets/out/ASSSETS.app
          sleep 8
          screencapture -x asssets/out/ASSSETS-0.3.0-library.png
          test -s asssets/out/ASSSETS-0.3.0-library.png
          sips -g pixelWidth -g pixelHeight asssets/out/ASSSETS-0.3.0-library.png
      - name: Upload ASSSETS visual proof
        uses: actions/upload-artifact@v4
        with:
          name: asssets-visual-proof
          path: asssets/out/ASSSETS-0.3.0-library.png
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-apps-universal-adhoc
          path: |
            architer/ARCHITER-0.2.0.dmg
            asssets/ASSSETS-0.3.0.dmg
      - name: Upload ARCHITER renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architer-renders
          if-no-files-found: warn
          path: architer/out/
      - name: MUEW demo renders
        run: cd muew && ./build/muew-demo && ./build/muew-demo-wt && ls -la out || true

  au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage AU continuation sources
        run: |
          cp muew/au/1-MUEWAU.cpp muew/au/MUEWAU.cpp
          cp muew/au/2-au_host_test.cpp muew/au/au_host_test.cpp
          cp muew/au/3-build_au.sh muew/au/build_au.sh
      - name: Build, sign, install and validate MUEW AU
        run: cd muew && au/build_au.sh
      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: muew-au-unsigned
          path: muew/out/MUEW-AU-unsigned.zip
