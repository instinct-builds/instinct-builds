name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ARCHITER tests
        run: cd architer && swift test
      - name: ARCHITER renders
        run: cd architer && swift run architer-render out
      - name: ARCHITER DMG
        run: cd architer && scripts/make_dmg.sh
      - name: Verify ARCHITER DMG
        run: |
          set -euo pipefail
          cd architer
          hdiutil verify ARCHITER-0.2.0.dmg
          mount=$(mktemp -d)
          hdiutil attach ARCHITER-0.2.0.dmg -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ARCHITER.app/Contents/MacOS/ARCHITER"
          lipo "$mount/ARCHITER.app/Contents/MacOS/ARCHITER" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ARCHITER.app"
          hdiutil detach "$mount"
      - name: Upload ARCHITER artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architer-0.2.0
          if-no-files-found: warn
          path: |
            architer/ARCHITER-0.2.0.dmg
            architer/out/
      - name: MUEW demo renders
        run: cd muew && ./build/muew-demo && ./build/muew-demo-wt && ls -la out || true

  asssets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASSSETS tests
        run: cd asssets && swift test
      - name: Build ASSSETS universal ad-hoc-signed DMG
        run: cd asssets && scripts/make_dmg.sh
      - name: Verify ASSSETS DMG and bundle size
        run: |
          set -euo pipefail
          cd asssets
          test $(stat -f%z ASSSETS-0.3.0.dmg) -gt 5000000
          hdiutil verify ASSSETS-0.3.0.dmg
          mount=$(mktemp -d)
          hdiutil attach ASSSETS-0.3.0.dmg -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ASSSETS.app/Contents/MacOS/ASSSETS"
          lipo "$mount/ASSSETS.app/Contents/MacOS/ASSSETS" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ASSSETS.app"
          test -d "$mount/ASSSETS.app/Contents/Resources/ASSSETS_AsssetsApp.bundle/StarterLibrary"
          du -sh "$mount/ASSSETS.app/Contents/Resources/ASSSETS_AsssetsApp.bundle/StarterLibrary"
          hdiutil detach "$mount"
      - name: Capture ASSSETS native UI proof
        run: |
          open asssets/out/ASSSETS.app
          sleep 10
          screencapture -x asssets/out/ASSSETS-0.3.0-library.png
          test -s asssets/out/ASSSETS-0.3.0-library.png
          sips -g pixelWidth -g pixelHeight asssets/out/ASSSETS-0.3.0-library.png
      - name: Upload ASSSETS 0.3.0
        uses: actions/upload-artifact@v4
        with:
          name: asssets-0.3.0
          path: |
            asssets/ASSSETS-0.3.0.dmg
            asssets/out/ASSSETS-0.3.0-library.png

  au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage AU continuation sources
        run: |
          cp muew/au/1-MUEWAU.cpp muew/au/MUEWAU.cpp
          cp muew/au/2-au_host_test.cpp muew/au/au_host_test.cpp
          cp muew/au/3-build_au.sh muew/au/build_au.sh
      - name: Build, sign, install and validate MUEW AU
        run: cd muew && au/build_au.sh
      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: muew-au-unsigned
          path: muew/out/MUEW-AU-unsigned.zip
