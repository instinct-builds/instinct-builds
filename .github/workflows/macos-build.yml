name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ARCHITER tests
        run: cd architer && swift test
      - name: ARCHITER renders
        run: cd architer && swift run architer-render out
      - name: Resolve ARCHITER version
        id: architer-ver
        run: |
          cd architer
          echo "value=$(sed -n 's/^VERSION=${VERSION:-\([^}]*\)}/\1/p' scripts/make_dmg.sh)" >> "$GITHUB_OUTPUT"
      - name: ARCHITER DMG
        run: cd architer && scripts/make_dmg.sh
      - name: Verify ARCHITER DMG
        run: |
          set -euo pipefail
          cd architer
          V="ARCHITER-${{ steps.architer-ver.outputs.value }}.dmg"
          hdiutil verify "$V"
          mount=$(mktemp -d)
          hdiutil attach "$V" -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ARCHITER.app/Contents/MacOS/ARCHITER"
          lipo "$mount/ARCHITER.app/Contents/MacOS/ARCHITER" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ARCHITER.app"
          hdiutil detach "$mount"
      - name: Upload ARCHITER artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architer-${{ steps.architer-ver.outputs.value }}
          if-no-files-found: warn
          path: |
            architer/ARCHITER-${{ steps.architer-ver.outputs.value }}.dmg
            architer/out/
      - name: MUEW demo renders
        run: cd muew && make all && make test && ./build/muew-demo && ./build/muew-demo-wt && ./build/muew-demo-mod-depth && ls -la out

  asssets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASSSETS tests
        run: cd asssets && swift test
      - name: Build ASSSETS universal ad-hoc-signed DMG
        run: cd asssets && scripts/make_dmg.sh
      - name: Verify ASSSETS DMG and bundle size
        run: |
          set -euo pipefail
          cd asssets
          V=$(sed -n 's/^VERSION=${VERSION:-\(.*\)}$/\1/p' scripts/make_dmg.sh)
          echo "ASSSETS_VERSION=$V" >> "$GITHUB_ENV"
          test $(stat -f%z ASSSETS-$V.dmg) -gt 5000000
          hdiutil verify ASSSETS-$V.dmg
          mount=$(mktemp -d)
          hdiutil attach ASSSETS-$V.dmg -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ASSSETS.app/Contents/MacOS/ASSSETS"
          lipo "$mount/ASSSETS.app/Contents/MacOS/ASSSETS" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ASSSETS.app"
          test -f "$mount/ASSSETS.app/Contents/Resources/StarterLibrary.zip"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$mount/ASSSETS.app/Contents/Info.plist")" = "$V"
          hdiutil detach "$mount"
      - name: Install test - fresh install, relaunch and 0.3 upgrade stay duplicate-free
        run: |
          set -euo pipefail
          SUP="$HOME/Library/Application Support/ASSSETS"
          count() { python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d["assets"]; k=[x.get("sourceKey") for x in a if x.get("sourceKey")]; assert len(k)==len(set(k)), "duplicate keys"; p=[x.get("importedPath") for x in a if x.get("importedPath")]; assert len(p)==len(set(p)), "duplicate paths"; print(len(a))' "$SUP/studio-catalog.json"; }
          run_once() { open -W -n asssets/out/ASSSETS.app --args -asssets-quit-after 6 || true; sleep 1; }
          rm -rf "$SUP"
          run_once; first=$(count); echo "fresh install: $first assets"
          test "$first" -ge 99
          test $(ls "$SUP/StarterLibrary" | wc -l) -ge 27
          run_once; second=$(count); echo "relaunch: $second assets"
          test "$first" = "$second"
          # Simulate a 0.3 catalog: drop the new keys, file starter media under Imported, remove the 0.4 file.
          python3 - "$SUP" <<'PY2'
          import json, sys, os
          sup = sys.argv[1]
          d = json.load(open(os.path.join(sup, "studio-catalog.json")))
          legacy = []
          for a in d["assets"]:
              a.pop("sourceKey", None)
              if a.get("importedPath"):
                  a["collection"] = "Imported"; a["tags"] = [a["importedPath"].rsplit(".", 1)[-1], "imported", "client-x"]
              legacy.append(a)
          legacy[0]["favorite"] = True
          json.dump(legacy, open(os.path.join(sup, "studio-library.json"), "w"))
          os.remove(os.path.join(sup, "studio-catalog.json"))
          PY2
          run_once; third=$(count); echo "after 0.3 migration: $third assets"
          test "$first" = "$third"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d["assets"]; assert not any(x["collection"]=="Imported" for x in a), "starter media left in Imported"; assert any("client-x" in x["tags"] for x in a), "user tags lost"; print("migration keeps user tags and refiles starter media")' "$SUP/studio-catalog.json"
      - name: Capture ASSSETS native UI proof (two window sizes)
        run: |
          set -euo pipefail
          # Start from a clean first launch so install-test state never shows up in the proof.
          rm -rf "$HOME/Library/Application Support/ASSSETS"
          cd asssets/out
          shoot() { open -n ASSSETS.app --args -asssets-demo "$1" -asssets-window "$2"; sleep 9; screencapture -x "ASSSETS-$ASSSETS_VERSION-$3.png"; pkill -x ASSSETS || true; sleep 2; }
          shoot media 1920x1200 library
          shoot batch 960x640 batch-compact
          shoot vectors 1920x1200 vectors
          shoot smart 1920x1200 smart-collection
          shoot smart-editor 1920x1200 smart-editor
          for f in ASSSETS-$ASSSETS_VERSION-*.png; do test -s "$f"; sips -g pixelWidth -g pixelHeight "$f"; done
      - name: Upload ASSSETS release
        uses: actions/upload-artifact@v4
        with:
          name: asssets-${{ env.ASSSETS_VERSION }}
          path: |
            asssets/ASSSETS-${{ env.ASSSETS_VERSION }}.dmg
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-*.png

  au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage AU continuation sources
        run: |
          cp muew/au/1-MUEWAU.cpp muew/au/MUEWAU.cpp
          cp muew/au/2-au_host_test.cpp muew/au/au_host_test.cpp
          cp muew/au/3-build_au.sh muew/au/build_au.sh
      - name: Build, sign, install and validate MUEW AU
        run: cd muew && au/build_au.sh
      - name: Build designed MUEW standalone app + DMG
        run: cd muew && scripts/make_muew_dmg.sh
      - name: Host MUEW AU editor like a DAW and capture proof
        run: |
          cd muew
          clang++ -std=c++17 -O2 -fobjc-arc -isysroot "$(xcrun --show-sdk-path)" -Isrc -Iau \
            au/au_view_host.mm -framework AppKit -framework AudioToolbox -framework AudioUnit -framework CoreFoundation \
            -o build/au_view_host
          ./build/au_view_host > out/au_view_host.log 2>&1 &
          pid=$!
          sleep 6
          screencapture -x out/MUEW-0.4.0-au-editor.png
          status=0
          wait $pid || status=$?
          cat out/au_view_host.log
          test "$status" -eq 0
          test -s out/MUEW-0.4.0-au-editor.png
      - name: Verify MUEW app and distribution
        run: |
          set -euo pipefail
          cd muew
          lipo out/MUEW.app/Contents/MacOS/MUEW -verify_arch arm64 x86_64
          codesign --verify --deep --strict out/MUEW.app
          hdiutil verify out/MUEW-0.4.0.dmg
      - name: Capture MUEW designed UI proof
        run: |
          cd muew
          open out/MUEW.app
          sleep 8
          screencapture -x out/MUEW-0.4.0-instrument.png
          test -s out/MUEW-0.4.0-instrument.png
          sips -g pixelWidth -g pixelHeight out/MUEW-0.4.0-instrument.png
          test "$(sips -g pixelWidth out/MUEW-0.4.0-instrument.png | awk '/pixelWidth/{print $2}')" -ge 1000
      - name: Upload MUEW release + visual proof
        uses: actions/upload-artifact@v4
        with:
          name: muew-0.4.0-au-editor
          path: |
            muew/out/MUEW-0.4.0.dmg
            muew/out/MUEW-0.4.0-instrument.png
            muew/out/MUEW-0.4.0-au-editor.png
            muew/out/au_view_host.log
            muew/out/MUEW-AU-unsigned.zip
      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: muew-au-unsigned
          path: muew/out/MUEW-AU-unsigned.zip
