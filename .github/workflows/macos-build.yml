      - name: Confirm factory render bytes against verified 0.52.0 on this Mac
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/muew-factory-baseline"
          git cat-file -e 81e67c83b5d935b2eae6e9fa5e28fa1cb332278c^{commit}
          git worktree add --detach "$baseline" 81e67c83b5d935b2eae6e9fa5e28fa1cb332278c
          cp muew/tests/factory_render_hash.cpp "$baseline/muew/tests/factory_render_hash.cpp"
          clang++ -std=c++17 -O2 -o "$RUNNER_TEMP/factory-hash-old" "$baseline/muew/tests/factory_render_hash.cpp"
          clang++ -std=c++17 -O2 -o "$RUNNER_TEMP/factory-hash-new" muew/tests/factory_render_hash.cpp
          old=$("$RUNNER_TEMP/factory-hash-old")
          new=$("$RUNNER_TEMP/factory-hash-new")
          echo "0.52.0 factory count/hash: $old"
          echo "0.53.0 factory count/hash: $new"
          test "$old" = "$new"
          test "${old%% *}" = 108
