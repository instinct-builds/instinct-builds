name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ARCHITER tests
        run: cd architer && swift test
      - name: ARCHITER renders
        run: cd architer && swift run architer-render out
      - name: Resolve ARCHITER version
        id: architer-ver
        run: |
          cd architer
          echo "value=$(sed -n 's/^VERSION=${VERSION:-\([^}]*\)}/\1/p' scripts/make_dmg.sh)" >> "$GITHUB_OUTPUT"
      - name: ARCHITER DMG
        run: cd architer && scripts/make_dmg.sh
      - name: Verify ARCHITER DMG
        run: |
          set -euo pipefail
          cd architer
          V="ARCHITER-${{ steps.architer-ver.outputs.value }}.dmg"
          hdiutil verify "$V"
          mount=$(mktemp -d)
          hdiutil attach "$V" -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ARCHITER.app/Contents/MacOS/ARCHITER"
          lipo "$mount/ARCHITER.app/Contents/MacOS/ARCHITER" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ARCHITER.app"
          hdiutil detach "$mount"
      - name: Upload ARCHITER artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architer-${{ steps.architer-ver.outputs.value }}
          if-no-files-found: warn
          path: |
            architer/ARCHITER-${{ steps.architer-ver.outputs.value }}.dmg
            architer/out/
      - name: MUEW demo renders
        run: cd muew && make all && make test && ./build/muew-demo && ./build/muew-demo-wt && ./build/muew-demo-mod-depth && ls -la out

  asssets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASSSETS tests
        run: cd asssets && swift test
      - name: Build ASSSETS universal ad-hoc-signed DMG
        run: cd asssets && scripts/make_dmg.sh
      - name: Verify ASSSETS DMG and bundle size
        run: |
          set -euo pipefail
          cd asssets
          V=$(sed -n 's/^VERSION=${VERSION:-\(.*\)}$/\1/p' scripts/make_dmg.sh)
          echo "ASSSETS_VERSION=$V" >> "$GITHUB_ENV"
          test $(stat -f%z ASSSETS-$V.dmg) -gt 5000000
          hdiutil verify ASSSETS-$V.dmg
          mount=$(mktemp -d)
          hdiutil attach ASSSETS-$V.dmg -nobrowse -readonly -mountpoint "$mount"
          file "$mount/ASSSETS.app/Contents/MacOS/ASSSETS"
          lipo "$mount/ASSSETS.app/Contents/MacOS/ASSSETS" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=4 "$mount/ASSSETS.app"
          test -f "$mount/ASSSETS.app/Contents/Resources/StarterLibrary.zip"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$mount/ASSSETS.app/Contents/Info.plist")" = "$V"
          hdiutil detach "$mount"
      - name: Install test - fresh install, relaunch and 0.3 upgrade stay duplicate-free
        run: |
          set -euo pipefail
          SUP="$HOME/Library/Application Support/ASSSETS"
          count() { python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d["assets"]; k=[x.get("sourceKey") for x in a if x.get("sourceKey")]; assert len(k)==len(set(k)), "duplicate keys"; p=[x.get("importedPath") for x in a if x.get("importedPath")]; assert len(p)==len(set(p)), "duplicate paths"; print(len(a))' "$SUP/studio-catalog.json"; }
          run_once() { open -W -n asssets/out/ASSSETS.app --args -asssets-quit-after 6 || true; sleep 1; }
          rm -rf "$SUP"
          run_once; first=$(count); echo "fresh install: $first assets"
          test "$first" -ge 129
          test $(ls "$SUP/StarterLibrary" | wc -l) -ge 57
          test $(ls "$SUP/StarterLibrary"/*.psd | wc -l) -eq 10
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["assets"]; p=[x for x in a if (x.get("importedPath") or "").endswith(".psd")]; assert len(p)==10 and all("layers" in x["resolution"] for x in p), [x["resolution"] for x in p]; print("psd metadata ok")' "$SUP/studio-catalog.json"
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["assets"]; t=[x for x in a if x.get("kind")=="Textures" and "starter" in (x.get("sourceKey") or "")]; gen=[x for x in t if "texture.png" in x["importedPath"]]; assert len(gen)==8 and all("seamless" in x["tags"] for x in gen), [(x["title"], x["tags"]) for x in gen]; print("seamless tags:", sum("seamless" in x["tags"] for x in t), "of", len(t))' "$SUP/studio-catalog.json"
          run_once; second=$(count); echo "relaunch: $second assets"
          test "$first" = "$second"
          # Simulate a 0.3 catalog: drop the new keys, file starter media under Imported, remove the 0.4 file.
          python3 - "$SUP" <<'PY2'
          import json, sys, os
          sup = sys.argv[1]
          d = json.load(open(os.path.join(sup, "studio-catalog.json")))
          legacy = []
          for a in d["assets"]:
              a.pop("sourceKey", None)
              if a.get("importedPath"):
                  a["collection"] = "Imported"; a["tags"] = [a["importedPath"].rsplit(".", 1)[-1], "imported", "client-x"]
              legacy.append(a)
          legacy[0]["favorite"] = True
          json.dump(legacy, open(os.path.join(sup, "studio-library.json"), "w"))
          os.remove(os.path.join(sup, "studio-catalog.json"))
          PY2
          run_once; third=$(count); echo "after 0.3 migration: $third assets"
          test "$first" = "$third"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); a=d["assets"]; assert not any(x["collection"]=="Imported" for x in a), "starter media left in Imported"; assert any("client-x" in x["tags"] for x in a), "user tags lost"; print("migration keeps user tags and refiles starter media")' "$SUP/studio-catalog.json"
      - name: Capture ASSSETS native UI proof (two window sizes)
        run: |
          set -euo pipefail
          # Start from a clean first launch so install-test state never shows up in the proof.
          rm -rf "$HOME/Library/Application Support/ASSSETS"
          cd asssets/out
          SUP="$HOME/Library/Application Support/ASSSETS"
          # Every shot after the first starts from the same fresh catalog, so one demo's files never leak into the next.
          shoot() {
            if [ -f /tmp/asssets-pristine.json ]; then cp /tmp/asssets-pristine.json "$SUP/studio-catalog.json"; rm -rf "$HOME/Pictures/Client Drops" "$SUP/Licenses"; fi
            open -n ASSSETS.app --args -asssets-demo "$1" -asssets-window "$2"; sleep "${DELAY:-9}"; screencapture -x "ASSSETS-$ASSSETS_VERSION-$3.png"
            # Optional 4th arg: a file the demo writes in the background; keep the app alive until it lands.
            if [ -n "${4:-}" ]; then for i in $(seq 1 90); do [ -s "$SUP/$4" ] && break; sleep 1; done; echo "waited ${i}s for $4"; fi
            pkill -x ASSSETS || true; sleep 2
            [ -f /tmp/asssets-pristine.json ] || cp "$SUP/studio-catalog.json" /tmp/asssets-pristine.json
          }
          shoot media 1920x1200 library
          shoot batch 960x640 batch-compact
          shoot vectors 1920x1200 vectors
          shoot smart 1920x1200 smart-collection
          shoot smart-editor 1920x1200 smart-editor
          shoot psd 1920x1200 psd-layers
          shoot textures 1920x1200 textures-tiling
          shoot seam-fix 1920x1200 seam-fix
          shoot viewer 1920x1200 viewer
          shoot watch 1920x1200 watch-folders
          shoot duplicates 1920x1200 duplicates
          shoot similar 1920x1200 find-similar
          shoot autotags 1920x1200 autotags
          shoot autotags-audio 1920x1200 autotags-audio
          shoot compare 1920x1200 compare
          shoot compare-swipe 1920x1200 compare-swipe
          shoot export-presets 1920x1200 export-presets demo-exports/done.txt
          ( cd "$SUP/demo-exports" && for f in *; do [ "$f" = done.txt ] && continue; printf '%s\t%s\t' "$f" "$(stat -f%z "$f")"; sips -g pixelWidth -g pixelHeight -g dpiWidth "$f" | awk 'NR>1{printf "%s=%s ", $1, $2}'; echo; done ) | tee "ASSSETS-$ASSSETS_VERSION-export-presets.txt"
          test "$(grep -c . "ASSSETS-$ASSSETS_VERSION-export-presets.txt")" -ge 18
          J=$(ls "$SUP/demo-exports/"*.jpg | head -1); grep -q "dc:subject" "$J" || { echo "no embedded XMP in $J"; exit 1; }; echo "embedded XMP found in $(basename "$J")"
          shoot gallery 1920x1200 gallery-app demo-gallery/gallery-done.txt
          G=$(ls -d "$SUP/demo-gallery/"*Review | head -1); test -f "$G/index.html"
          unzip -l "$G.zip" | tee "ASSSETS-$ASSSETS_VERSION-gallery-listing.txt"; grep -q 'index.html' "ASSSETS-$ASSSETS_VERSION-gallery-listing.txt"
          if grep -q '__MACOSX' "ASSSETS-$ASSSETS_VERSION-gallery-listing.txt"; then echo "gallery zip has __MACOSX"; exit 1; fi
          CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; test -x "$CH"
          U=$(python3 -c 'import sys,pathlib; print(pathlib.Path(sys.argv[1]).as_uri())' "$G/index.html")
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-gallery-web.png" "$U?demo=grid" || true
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-gallery-lightbox.png" "$U?demo=lightbox" || true
          test -s "ASSSETS-$ASSSETS_VERSION-gallery-web.png"
          shoot gallery-import 1920x1200 gallery-import
          shoot stacks 1920x1200 stacks
          shoot stack-compare 1920x1200 stack-compare
          shoot ratings 1920x1200 ratings
          shoot label-filter 1920x1200 label-filter
          shoot cull 1920x1200 cull
          shoot sort-rating 1920x1200 sort-rating
          shoot keywords 1920x1200 keywords
          shoot file-metadata 1920x1200 file-metadata
          S="$HOME/Pictures/Client Drops/DSC_0192.xmp"; cp "$S" "ASSSETS-$ASSSETS_VERSION-sidecar.xmp.txt"
          grep -q 'crs:Exposure2012="+0.35"' "$S" && grep -q '<xmp:Label>Blue</xmp:Label>' "$S" && grep -q 'round 2' "$S" && grep -q 'Marble Wall Study' "$S" || { echo "sidecar write-back lost data"; cat "$S"; exit 1; }
          echo "sidecar keeps develop settings and has the new label and tag"
          shoot batch-rename 1920x1200 batch-rename
          shoot folder-export 1920x1200 folder-export demo-folder-export/done.txt
          FE="$SUP/demo-folder-export"
          ( cd "$FE" && find . -type f ! -name done.txt | sort ) | tee "ASSSETS-$ASSSETS_VERSION-folder-export-tree.txt"
          T="ASSSETS-$ASSSETS_VERSION-folder-export-tree.txt"
          grep -q '^./Device Mockups/Green/' "$T" && grep -q '^./Device Mockups/Blue/' "$T" && grep -q '^./Material Textures/Red/' "$T" && grep -q '^./Material Textures/No Label/' "$T" || { echo "folder export tree is wrong"; exit 1; }
          test "$(grep -c . "$T")" -ge 18
          if find "$FE" -maxdepth 1 -type f -name '*.jpg' | grep -q .; then echo "files landed outside their subfolders"; exit 1; fi
          J=$(find "$FE" -mindepth 3 -name '*.jpg' | head -1); grep -q "dc:subject" "$J" || { echo "no embedded XMP in $J"; exit 1; }
          echo "folder export: $(grep -c . "$T") files in $(cut -d/ -f2-3 "$T" | sort -u | wc -l | tr -d ' ') folders, XMP embedded"
          shoot color-search 1920x1200 color-search demo-color-search.txt
          C="ASSSETS-$ASSSETS_VERSION-color-search.txt"; cp "$SUP/demo-color-search.txt" "$C"; cat "$C"
          n=$(head -1 "$C" | sed -E 's/.* ([0-9]+) matches/\1/'); test "$n" -ge 8 || { echo "color search found only $n"; exit 1; }
          awk -F'\t' 'NR>1 && $3+0 > 12.0 { bad=1 } END { exit bad }' "$C" || { echo "a ranked result is outside the tolerance"; exit 1; }
          shoot color-smart 1920x1200 color-smart
          shoot board 1920x1200 board
          shoot board-export 1920x1200 board-export demo-board.txt
          cat "$SUP/demo-board.txt"; grep -q '^done' "$SUP/demo-board.txt" || { echo "board export did not finish"; exit 1; }
          B="ASSSETS-$ASSSETS_VERSION-board-render.png"; cp "$SUP/demo-board.png" "$B"; cp "$SUP/demo-board.pdf" "ASSSETS-$ASSSETS_VERSION-board-render.pdf"
          bw=$(sips -g pixelWidth "$B" | awk '/pixelWidth/ {print $2}'); bh=$(sips -g pixelHeight "$B" | awk '/pixelHeight/ {print $2}')
          echo "board PNG ${bw}x${bh}"; test "$bw" -ge 1600 -a "$bh" -ge 800 || { echo "board PNG too small"; exit 1; }
          shoot focus 1920x1200 focus
          shoot present 1920x1200 present
          shoot board-edit 1920x1200 board-edit
          shoot board-annotate 1920x1200 board-annotate demo-annotate.txt
          cat "$SUP/demo-annotate.txt"; grep -q '^done .* arrows=3' "$SUP/demo-annotate.txt" || { echo "annotated board export did not finish"; exit 1; }
          cp "$SUP/demo-annotate.png" "ASSSETS-$ASSSETS_VERSION-annotate-render.png"
          shoot board-crop 1920x1200 board-crop
          shoot present-annotate 1920x1200 present-annotate
          shoot board-gallery 1920x1200 board-gallery-app demo-board-gallery/gallery-done.txt
          BG=$(ls -d "$SUP/demo-board-gallery/"*Review | head -1); test -s "$BG/board.png"; grep -q '"spots"' "$BG/index.html" || { echo "board gallery has no board"; exit 1; }
          unzip -l "$BG.zip" | tee "ASSSETS-$ASSSETS_VERSION-board-gallery-listing.txt"; grep -q 'board.png' "ASSSETS-$ASSSETS_VERSION-board-gallery-listing.txt"
          shoot board-review 1920x1200 board-review
          shoot board-versions 1920x1200 board-versions
          shoot board-thread 1920x1200 board-thread
          shoot board-status 1920x1200 board-status demo-summary.txt
          cat "$SUP/demo-summary.txt"; grep -q '^done rows=[1-9]' "$SUP/demo-summary.txt" || { echo "round summary did not render"; exit 1; }
          cp "$SUP/demo-summary.png" "ASSSETS-$ASSSETS_VERSION-round-summary.png"; cp "$SUP/demo-summary.pdf" "ASSSETS-$ASSSETS_VERSION-round-summary.pdf"
          shoot board-templates 1920x1200 board-templates
          shoot board-template 1920x1200 board-template
          shoot share-round 1920x1200 share-round demo-share-round/gallery-done.txt
          SR=$(ls -d "$SUP/demo-share-round/"*Review | head -1); test -s "$SR/round-summary.pdf"; grep -q '"summary":"round-summary.pdf"' "$SR/index.html" || { echo "share round has no summary link"; exit 1; }
          unzip -l "$SR.zip" | tee "ASSSETS-$ASSSETS_VERSION-share-round-listing.txt"; grep -q 'round-summary.pdf' "ASSSETS-$ASSSETS_VERSION-share-round-listing.txt"
          grep -q 'id="lbap"' "$SR/index.html" || { echo "gallery has no Approve control"; exit 1; }
          SRU=$(python3 -c 'import sys,pathlib; print(pathlib.Path(sys.argv[1]).as_uri())' "$SR/index.html")
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-gallery-approve.png" "$SRU?demo=approve" || true
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-gallery-approve-grid.png" "$SRU?demo=approve-grid" || true
          test -s "ASSSETS-$ASSSETS_VERSION-gallery-approve.png"
          shoot feedback-preview 1920x1200 feedback-preview
          shoot feedback-imported 1920x1200 feedback-imported
          shoot board-arrange-before 1920x1200 board-arrange-before
          shoot board-arrange 1920x1200 board-arrange
          shoot board-versions-follow 1920x1200 board-versions-follow
          shoot board-updated 1920x1200 board-updated
          shoot inspector-on-boards 1920x1200 inspector-on-boards
          shoot board-paste 1920x1200 board-paste
          shoot rights-inspector 1920x1200 rights-inspector
          shoot rights-expiring 1920x1200 rights-expiring
          shoot board-rights 1920x1200 board-rights
          shoot share-credits 1920x1200 share-credits demo-share-credits/gallery-done.txt
          SC=$(ls -d "$SUP/demo-share-credits/"*Review | head -1); grep -q '"credits":\[' "$SC/index.html" || { echo "gallery has no credits"; exit 1; }
          grep -q 'Lena Ortiz' "$SC/index.html" || { echo "gallery credits missing Northlight line"; exit 1; }
          ls "$HOME/Pictures/Client Drops/" | tee "ASSSETS-$ASSSETS_VERSION-rights-drop.txt"; cat "$HOME/Pictures/Client Drops/Northlight Lobby.xmp" | tee "ASSSETS-$ASSSETS_VERSION-rights-sidecar.xmp.txt"; grep -q 'photoshop:Credit' "ASSSETS-$ASSSETS_VERSION-rights-sidecar.xmp.txt"
          SCU=$(python3 -c 'import sys,pathlib; print(pathlib.Path(sys.argv[1]).as_uri())' "$SC/index.html")
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-gallery-credits.png" "$SCU?demo=credits" || true
          test -s "ASSSETS-$ASSSETS_VERSION-gallery-credits.png"
          shoot rights-bulk 1920x1200 rights-bulk
          shoot rights-report 1920x1200 rights-report-app demo-rights-report.txt
          cat "$SUP/demo-rights-report.txt"; grep -q '^done pages=[1-9] rows=6' "$SUP/demo-rights-report.txt" || { echo "rights report did not render"; exit 1; }
          cp "$SUP/demo-rights-report.png" "ASSSETS-$ASSSETS_VERSION-rights-report.png"; cp "$SUP/demo-rights-report.pdf" "ASSSETS-$ASSSETS_VERSION-rights-report.pdf"
          cp "$SUP/demo-rights-report.csv" "ASSSETS-$ASSSETS_VERSION-rights-report.csv.txt"; head -3 "ASSSETS-$ASSSETS_VERSION-rights-report.csv.txt"
          grep -q 'Harbor Night' "ASSSETS-$ASSSETS_VERSION-rights-report.csv.txt" || { echo "rights report CSV is missing rows"; exit 1; }
          shoot rights-alerts 1920x1200 rights-alerts
          grep -q 'License files' "ASSSETS-$ASSSETS_VERSION-rights-report.csv.txt" && grep -q 'NL-20417 order confirmation.pdf' "ASSSETS-$ASSSETS_VERSION-rights-report.csv.txt" || { echo "rights report CSV does not list license files"; exit 1; }
          grep -q '"files":\[' "$SC/index.html" || { echo "gallery credits do not name license files"; exit 1; }
          ls -l "$SUP/Licenses" | tee "ASSSETS-$ASSSETS_VERSION-licenses-listing.txt"; test "$(ls "$SUP/Licenses" | wc -l)" -ge 3 || { echo "license files were not stored"; exit 1; }
          shoot license-files 1920x1200 license-files
          shoot rights-presets 1920x1200 rights-presets
          shoot export-guard 1920x1200 export-guard
          # Wait for the watch-folder import and thumbnails to settle before the capture (1.28 fix1 caught it mid-load).
          DELAY=24 shoot batch-license-row 1920x1200 batch-license-row
          shoot duplicates-merge 1920x1200 duplicates-merge
          shoot library-health 1920x1200 library-health
          DELAY=15 shoot source-review-queue 1920x1200 source-review-queue
          DELAY=15 shoot source-review-queue-next 1920x1200 source-review-queue-next demo-source-queue.txt
          grep -q '^done queue-next=true pending=1$' "$SUP/demo-source-queue.txt"
          DELAY=13 shoot changed-source 1920x1200 changed-source
          DELAY=13 shoot changed-source-review 1920x1200 changed-source-review
          DELAY=14 shoot changed-source-inspector 1920x1200 changed-source-inspector
          DELAY=13 shoot changed-source-apply 1920x1200 changed-source-apply demo-changed-source.txt
          grep -q '^done changed=true rights=true boards=[1-9]' "$SUP/demo-changed-source.txt"
          DELAY=14 shoot source-history-inspector 1920x1200 source-history-inspector demo-changed-source.txt
          grep -q '^done changed=true rights=true boards=[1-9]' "$SUP/demo-changed-source.txt"
          python3 - "$SUP/studio-catalog.json" <<'PY2'
          import json,sys
          c=json.load(open(sys.argv[1])); r=c['sourceRefreshHistory']; assert len(r)==1, r
          entry=r[0]; assert entry['before']['sha256'] != entry['after']['sha256']
          assert entry['path'].endswith('Northlight Lobby.png')
          print('source receipt survives catalog reload; no source bytes embedded')
          PY2
          DELAY=18 shoot folder-relink 1920x1200 folder-relink
          DELAY=18 shoot folder-relink-collapsed 1920x1200 folder-relink-collapsed
          DELAY=18 shoot folder-relink-apply 1920x1200 folder-relink-apply demo-folder-relink.txt
          grep -q '^done relinked=2 unmatched=1 watch=moved$' "$SUP/demo-folder-relink.txt"
          BU=$(python3 -c 'import sys,pathlib; print(pathlib.Path(sys.argv[1]).as_uri())' "$BG/index.html")
          "$CH" --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 --window-size=1600,1000 --screenshot="$PWD/ASSSETS-$ASSSETS_VERSION-board-gallery-web.png" "$BU?demo=grid" || true
          test -s "ASSSETS-$ASSSETS_VERSION-board-gallery-web.png"
          shoot color-smart-editor 1920x1200 color-smart-editor
          shoot contact-sheet 1920x1200 contact-sheet demo-contact-sheet-all.pdf
          shoot place-mockup 1920x1200 place-mockup
          DELAY=14 shoot place-all 1920x1200 place-all demo-place-all.txt
          DELAY=12 shoot place-edit 1920x1200 place-edit
          DELAY=12 shoot place-relink 1920x1200 place-relink
          DELAY=16 shoot batch-place 1920x1200 batch-place
          DELAY=16 shoot placement-presets 1920x1200 placement-presets
          DELAY=16 shoot batch-place-results 1920x1200 batch-place-results demo-batch-place.txt
          grep -q '^done placed=3 recipes=3 rights=3 unique-art=3 cropped=0$' "$SUP/demo-batch-place.txt"
          DELAY=16 shoot batch-compare 1920x1200 batch-compare
          DELAY=16 shoot batch-focus 1920x1200 batch-focus
          DELAY=16 shoot batch-focus-next 1920x1200 batch-focus-next
          DELAY=16 shoot batch-focus-last 1920x1200 batch-focus-last
          DELAY=16 shoot batch-focus-fit 1920x1200 batch-focus-fit
          DELAY=16 shoot batch-crop 1920x1200 batch-crop
          DELAY=16 shoot batch-crop-results 1920x1200 batch-crop-results demo-batch-place.txt
          grep -q '^done placed=3 recipes=3 rights=3 unique-art=3 cropped=2$' "$SUP/demo-batch-place.txt"
          cp "$SUP/demo-contact-sheet.pdf" "ASSSETS-$ASSSETS_VERSION-contact-sheet.pdf"
          ls -l "$SUP" | tee "ASSSETS-$ASSSETS_VERSION-pdf-sizes.txt"
          cp "$SUP/demo-contact-sheet-all.pdf" "ASSSETS-$ASSSETS_VERSION-contact-sheet-all.pdf"
          ls -l ASSSETS-$ASSSETS_VERSION-contact-sheet*.pdf | tee -a "ASSSETS-$ASSSETS_VERSION-pdf-sizes.txt"
          # JPEG thumbnails: the 28-asset Material Textures sheet stays under 2 MB (1.5.0: ~10.7 MB),
          # and the whole bundled library (129 assets, 12 pages) under 6 MB.
          size=$(stat -f%z "ASSSETS-$ASSSETS_VERSION-contact-sheet.pdf"); all=$(stat -f%z "ASSSETS-$ASSSETS_VERSION-contact-sheet-all.pdf")
          echo "28-asset sheet: $size bytes; whole-library sheet: $all bytes" | tee -a "ASSSETS-$ASSSETS_VERSION-pdf-sizes.txt"
          test "$size" -lt 2000000
          test "$all" -lt 6000000
          test "$(mdls -raw -name kMDItemNumberOfPages "ASSSETS-$ASSSETS_VERSION-contact-sheet.pdf" 2>/dev/null || echo 4)" != "0"
          sips -s format png --resampleWidth 1600 "ASSSETS-$ASSSETS_VERSION-contact-sheet.pdf" --out "ASSSETS-$ASSSETS_VERSION-contact-sheet-cover.png" >/dev/null
          unzip -l "$SUP/demo-brand-kit.zip" | tee "ASSSETS-$ASSSETS_VERSION-brand-kit-listing.txt"
          grep -q 'Palette.ase' "ASSSETS-$ASSSETS_VERSION-brand-kit-listing.txt"
          grep -q 'Contact Sheet.pdf' "ASSSETS-$ASSSETS_VERSION-brand-kit-listing.txt"
          for f in ASSSETS-$ASSSETS_VERSION-*.png; do test -s "$f"; sips -g pixelWidth -g pixelHeight "$f"; done
      - name: Upload ASSSETS release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asssets-${{ env.ASSSETS_VERSION }}
          path: |
            asssets/ASSSETS-${{ env.ASSSETS_VERSION }}.dmg
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-*.png
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-contact-sheet*.pdf
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-pdf-sizes.txt
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-export-presets.txt
            asssets/out/ASSSETS-${{ env.ASSSETS_VERSION }}-gallery-listing.txt
